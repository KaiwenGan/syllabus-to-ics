name: test

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 依赖
        run: pip install pymupdf
      - name: 冒烟测试
        run: python -m unittest discover -s tests -v
      - name: 真实案例可复现
        run: |
          python scripts/build.py -c assets/example-university-2026-fall.config.json -o /tmp/demo.ics
          python scripts/audit.py -c assets/example-university-2026-fall.config.json -i /tmp/demo.ics
